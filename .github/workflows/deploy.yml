name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Repo variables (Settings > Secrets and variables > Actions > Variables).
      PUBLIC_WEB3FORMS_KEY: ${{ vars.PUBLIC_WEB3FORMS_KEY }}
      PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}
    steps:
      - name: Require repo variables
        run: |
          [ -n "$PUBLIC_WEB3FORMS_KEY" ] || { echo "::error::Repo variable PUBLIC_WEB3FORMS_KEY is not set (contact form would not send)"; exit 1; }
          [ -n "$PUBLIC_GA_ID" ] || { echo "::error::Repo variable PUBLIC_GA_ID is not set"; exit 1; }
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
